[project]
name = "planttoxmi"
version = "0.1.0"
description = "Deterministic PlantUML to XMI 2.1 converter for Enterprise Architect imports"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "planttoxmi contributors" }]
dependencies = [
    "lxml>=5.2.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0.0",
    "pytest>=8.2.0",
]
ea = [
    "pywin32>=306; platform_system == 'Windows'",
]

[project.scripts]
planttoxmi = "planttoxmi.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "ea: tests that require Sparx Enterprise Architect COM automation",
]

[tool.ruff]
line-length = 100
target-version = "py312"
